<!DOCTYPE html>
<html>
<head>
    <title>Login - Servidor de Arquivos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 100px auto; padding: 20px; }
        .login-box { background: #f4f4f4; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acessar Servidor</h2>
        
        {% if form.errors %}
            <p class="error">Usuário ou senha incorretos.</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Usuário:</label>
            {{ form.username }}
            
            <label>Senha:</label>
            {{ form.password }}
            
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
